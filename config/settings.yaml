app:
  name: "Smart Inventory and Demand Forecasting System"
  version: "0.1.0"
  environment: "development"

data:
  raw_dir: "data/raw"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  synthetic_dir: "data/synthetic"
  
synthetic:
  seed: 42
  num_stores: 3
  num_products: 15
  start_date: "2023-01-01"
  end_date: "2024-03-31"

forecasting:
  horizons: [7, 28]
  validation_days: 28
  test_days: 28
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 28]
  models:
    seasonal_naive:
      seasonality: 7
    moving_average:
      window: 7
    lightgbm:
      n_estimators: 150
      learning_rate: 0.05
      num_leaves: 31
      random_state: 42
      min_child_samples: 10

inventory:
  default_lead_time_days: 7
  default_service_level: 0.95
  default_holding_cost_rate: 0.20
  min_order_quantity_default: 10
  order_multiple_default: 5
  max_capacity_multiplier: 3.0
  overstock_threshold_days: 45
  slow_moving_threshold_sales: 2

spark:
  app_name: "SmartInventoryETL"
  master: "spark://spark-master:7077"
  local_master: "local[*]"
  driver_memory: "1g"
  executor_memory: "1g"
  executor_cores: 1
