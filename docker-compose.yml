services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database (Hosts both app DB and Airflow DB)
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      AIRFLOW_USER: ${AIRFLOW_USER:-airflow_user}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow_secure_pass}
      AIRFLOW_DB: ${AIRFLOW_DB:-airflow_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 2. Apache Spark Master Node
  # -------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./src:/opt/spark/work-dir/src
      - ./scripts:/opt/spark/work-dir/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 3. Apache Spark Worker 1
  # -------------------------------------------------------------
  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./src:/opt/spark/work-dir/src
      - ./scripts:/opt/spark/work-dir/scripts
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 4. Apache Spark Worker 2
  # -------------------------------------------------------------
  spark-worker-2:
    image: apache/spark:3.5.0
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1g
      - SPARK_WORKER_WEBUI_PORT=8082
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8082:8082"
    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./src:/opt/spark/work-dir/src
      - ./scripts:/opt/spark/work-dir/scripts
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 5. FastAPI Backend
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: inventory-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory_secure_pass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-inventory_db}
      API_KEY: ${API_KEY:-dev-secret-api-key-2026}
      SPARK_MASTER_URL: spark://spark-master:7077
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 6. Airflow Init
  # -------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME:-admin} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com} \
          --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_USER:-airflow_user}:${AIRFLOW_PASSWORD:-airflow_secure_pass}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 7. Airflow Webserver
  # -------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-webserver
    command: webserver
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_USER:-airflow_user}:${AIRFLOW_PASSWORD:-airflow_secure_pass}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PROJECT_ROOT=/opt/airflow/dags/repo
    ports:
      - "8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dags/repo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - inventory-network

  # -------------------------------------------------------------
  # 8. Airflow Scheduler
  # -------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: airflow-scheduler
    command: scheduler
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${AIRFLOW_USER:-airflow_user}:${AIRFLOW_PASSWORD:-airflow_secure_pass}@postgres:5432/${AIRFLOW_DB:-airflow_db}
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PROJECT_ROOT=/opt/airflow/dags/repo
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/dags/repo
    networks:
      - inventory-network

volumes:
  postgres-data:
    driver: local

networks:
  inventory-network:
    driver: bridge
